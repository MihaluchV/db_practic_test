<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Бази даних і СУБД — повторення</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#5d667a;--ac:#3b5bdb;--acs:#e7ecff;--ok:#2b8a3e;--oks:#e3f6e8;--bad:#c92a2a;--bads:#fde8e8;--bd:#d5d9e5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12151d;--card:#1b2030;--tx:#eceff7;--mu:#9aa3b8;--ac:#7c9bff;--acs:#27304f;--ok:#69db7c;--oks:#1d3a28;--bad:#ff8787;--bads:#47232a;--bd:#363d54}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 10px;color:var(--mu);font-weight:600}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.dot{width:32px;height:32px;border-radius:50%;border:2px solid var(--bd);background:var(--card);color:var(--mu);font-weight:700;cursor:pointer}
.dot.now{border-color:var(--ac);color:var(--ac)}.dot.done{background:var(--ok);border-color:var(--ok);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px}
.badge{display:inline-block;background:var(--acs);color:var(--ac);border-radius:20px;padding:2px 12px;font-size:14px;font-weight:600;margin-bottom:8px}
.q{font-size:22px;font-weight:650;margin:0 0 16px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border:2px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.on{border-color:var(--ac);background:var(--acs)}
.ok{border-color:var(--ok)!important;background:var(--oks)!important}.bad{border-color:var(--bad)!important;background:var(--bads)!important}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0}
select{font:inherit;padding:6px 8px;border:2px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);max-width:100%}
.zones{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.zone{flex:1 1 200px;min-height:90px;border:2px dashed var(--bd);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px}
.zone b{color:var(--mu);font-size:15px}
.pool{border-style:solid;background:var(--bg)}
.it{padding:8px 12px;border:2px solid var(--bd);border-radius:8px;background:var(--card);cursor:grab;font-size:17px}
.tw{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse}
th,td{border:1px solid var(--bd);padding:8px 14px;text-align:left}
th{background:var(--acs)}
.cl{cursor:pointer}.cl:hover{outline:2px solid var(--ac)}
td.on,th.on{background:var(--acs);outline:3px solid var(--ac)}
td.ok,th.ok{outline:3px solid var(--ok)}td.bad,th.bad{outline:3px solid var(--bad)}
.lk{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:clamp(60px,14vw,180px);margin:10px 0}.lc{display:flex;flex-direction:column;gap:12px}.ls{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.li{cursor:crosshair;touch-action:none;user-select:none}.ri{cursor:default;user-select:none}.li.on{border-color:var(--ac);background:var(--acs)}
.cap{color:var(--mu);font-size:15px;margin-top:6px}
.fb{min-height:28px;margin:14px 0 0;font-weight:600}.fb.g{color:var(--ok)}.fb.r{color:var(--bad)}
.hint{margin-top:10px;padding:10px 14px;border-radius:10px;background:var(--acs);display:none}
.bar{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;padding:10px 20px;border-radius:10px;border:2px solid var(--ac);background:var(--card);color:var(--ac);cursor:pointer}
.btn.p{background:var(--ac);color:#fff}.sp{flex:1}
</style>
</head>
<body>
<main>
<h1>Бази даних і СУБД — повторення</h1>
<div class="dots" id="dots"></div>
<div class="card" id="card"></div>
</main>
